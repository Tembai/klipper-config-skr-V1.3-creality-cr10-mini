# This file contains common pin mappings for the BIGTREETECH SKR V1.3
# board. To use this config, the firmware should be compiled for the
# LPC1768.

# See the example.cfg file for a description of available parameters.


# will possibly need to adjust the max positions. The standard config file for the creality cr10 mini seems to use 16 microsteps,
# but this file seems to use 1/80=0.0125 => 80 microsteps.

# PID values are different too

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
#step_distance: .0125
rotation_distance: 40
endstop_pin: ^P1.29  # P1.28 for X-max
position_endstop: 0
position_max: 300
#homing_speed: 50

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
#step_distance: .0125
rotation_distance: 40
endstop_pin: ^P1.27  # P1.26 for Y-max
position_endstop: 0
position_max: 220
#homing_speed: 50

[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
#step_distance: .0025
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop  # Use BLTouch as Z endstop
#position_endstop: 0  # Not used with probe
# SAFETY (2026-08-15): tightened from -5 to -1.5. SCREWS_TILT_CALCULATE crashed the
# nozzle into the glass bed 3 separate times (probe apparently not triggering/deploying
# reliably - unresolved intermittent BLTouch fault, see troubleshooting_steps.txt) and
# each time Z kept lowering with no trigger until it ran out of software travel. This
# limit is the last line of defense against a hard crash if that happens again - do not
# increase it back without first resolving the underlying probe reliability issue.
position_min: -1.5
position_max: 400

[safe_z_home]
home_xy_position: 150, 110  # Center of bed for homing
speed: 50
z_hop: 10                   # Lift Z before homing
z_hop_speed: 5


# Quick per-print bed-mesh recalibration DISABLED (2026-08-09) while debugging extrusion
# consistency - just loads the last saved 'default' profile instead. Re-enable (see git
# history) if the bed is releveled/moved.

[gcode_macro PRINT_START]
gcode:
    {% set BED = params.BED|default(55)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(220)|float %}

    M140 S{BED}
    M104 S150

    G28

    # (2026-08-31) Bed mesh loading disabled: a test print with the tilt-plane
    # default profile failed badly across half the bed. Assume a perfectly flat
    # bed for now (BED_MESH_CLEAR ensures no stale/previously-loaded mesh is
    # applied) until the mesh data/application is investigated further.
    BED_MESH_CLEAR

    M190 S{BED}
    M104 S{EXTRUDER}
    M109 S{EXTRUDER}


[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
#step_distance: .010526
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
#sensor_type: EPCOS 100K B57560G104F
sensor_type: Generic 3950
sensor_pin: P0.24
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
pressure_advance: 0.52           # From PA pattern test V5-retest (range 0.3-0.92, step 0.02) re-printed on
                                  # 2026-08-15 after the max_z_accel:100->80 revert + 10x10 mesh recalibration.
                                  # Best print so far by far - nearly all of the pattern adhered properly, only
                                  # one small intra-layer adhesion spot remained (down from widespread fusion
                                  # failure in the 0.62/0.5 PA tests). Some stringing still present - candidate
                                  # for a future retraction/print-speed tuning pass. See pa_pattern_test_log.md.
max_extrude_only_velocity: 50    # Matches Marlin stock machine_max_feedrate_e
max_extrude_only_accel: 5000     # Matches Marlin stock machine_max_acceleration_e

#[extruder1]
#step_pin: P0.1
#dir_pin: P0.0
#enable_pin: !P0.10
#heater_pin: P2.4
#sensor_pin: P0.25
#...

[heater_bed]
heater_pin: P2.5
#sensor_type: ATC Semitec 104GT-2
sensor_type: Generic 3950
sensor_pin: P0.23
#control: watermark
# alternativ zu watermark: pid
control: pid
pid_Kp: 690.34
pid_Ki: 111.47
pid_Kd: 1068.83
min_temp: 0
max_temp: 130

[fan]
pin: P2.3

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_lpc1768_0E700116612448AFBA2F285DC32000F5-if00
serial: /dev/ttyAMA0
baud: 250000
#serial: /dev/serial0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 150       # Matches Cura/Marlin stock speed_travel (150mm/s @ speed_print=50) - was 100, clipping travel moves
max_accel: 800          # Reverted to prior value (2026-08-12) - the 500 tried in the 08-09 session clamped
                         # every print/travel move to a uniform, very low acceleration and correlated with
                         # adjacent in-layer lines failing to fuse in the two PA tests done since. 800 was
                         # the known-good value from before that change.
max_z_velocity: 5
max_z_accel: 80         # Reverted to prior value (2026-08-13) - this was raised to 100 in the 08-09
                        # "match stock Marlin" session alongside max_accel/square_corner_velocity, but unlike
                        # those two, it was never reverted back. A full V1-V5 gcode/octoprint-log timeline
                        # cross-check showed max_z_accel=100 was present in EVERY print with poor in-layer
                        # fusion (V3/V4/V5) and absent in both good prints (V1/V2), making it a live suspect
                        # alongside max_velocity below and the disabled per-print mesh recal (see PRINT_START).
square_corner_velocity: 2.0  # Reverted to prior value (2026-08-12) alongside max_accel above, for the same reason.


########################################
# TMC2208 configuration
########################################

[tmc2208 stepper_x]
uart_pin: P1.17
run_current: 0.850
hold_current: 0.500
stealthchop_threshold: 999999

[tmc2208 stepper_y]
uart_pin: P1.15
run_current: 0.950
hold_current: 0.550
stealthchop_threshold: 999999

[tmc2208 stepper_z]
uart_pin: P1.10
run_current: 0.650
hold_current: 0.450
stealthchop_threshold: 999999

[tmc2208 extruder]
uart_pin: P1.8
run_current: 0.850
hold_current: 0.500
stealthchop_threshold: 999999  # Reverted to StealthChop (2026-08-09) - SpreadCycle test didn't fix the start-of-line stutter, just added noise



########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"

# See the sample-lcd.cfg file for definitions of common LCD displays.

###
### "RepRapDiscount 128x64 Full Graphic Smart Controller" type displays
###
[display]
lcd_type: st7920
cs_pin: EXP1_4
sclk_pin: EXP1_5
sid_pin: EXP1_3
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
#kill_pin: ^!EXP2_8

[output_pin beeper]
pin: EXP1_1

# Virtual SD Card for OctoPrint compatibility
[virtual_sdcard]
path: ~/gcode_files

# Pause/Resume support
[pause_resume]

# Display status for OctoPrint
[display_status]

# Apparently, this makes OrcaSlicer play happy with the printer.
[exclude_object]

# Native BLTouch driver (replaces the old servo/[probe] workaround).
# Wiring: sensor signal on P1.25, control signal on P2.0 (same pins the
# old servo/[probe] setup used).
[bltouch]
sensor_pin: ^P1.25
control_pin: P2.0

x_offset: -37.0              # Measured nozzle-to-probe X offset
y_offset: -7.0               # Measured nozzle-to-probe Y offset
z_offset: 0.900              # Re-calibrated via PROBE_CALIBRATE paper test on 2026-09-03

speed: 3.0
lift_speed: 5.0
samples: 5                       # Raised from 3 (2026-08-30) to fortify outlier rejection on every command that
                                 # goes through the probe module (PROBE, PROBE_ACCURACY, PROBE_CALIBRATE,
                                 # BED_MESH_CALIBRATE, SCREWS_TILT_CALCULATE) - median-of-5 is much more resistant
                                 # to a single bad trigger than median-of-3. NOTE: this does NOT affect the raw
                                 # G28 homing trigger itself (probe:z_virtual_endstop) - Klipper's homing code
                                 # uses a single-sample physical endstop trigger and has no native multi-sample/
                                 # median capability there. The Z-offset applied during homing is still whatever
                                 # PROBE_CALIBRATE last established (which DOES benefit from this setting).
samples_result: median
samples_tolerance: 0.25         # Raised from 0.05 - live testing on 2026-08-10 showed a single point swing
                                 # ~0.0675-0.1975mm (0.13mm range) across 8 retries and never converged at 0.05,
                                 # aborting BED_MESH_CALIBRATE entirely. 0.25 covers the ~0.18-0.35mm repeatability
                                 # documented in troubleshooting_steps.txt while still catching real outliers.
samples_tolerance_retries: 3
sample_retract_dist: 3.0

stow_on_each_sample: True
probe_with_touch_mode: False

[bed_screws]
screw1: 30, 30
screw2: 270, 30
screw3: 30, 210
screw4: 270, 210


# Default bed_mesh profile (2026-08-30): hand-authored from the 2026-08-22 3-point
# BED_PLANE_CALIBRATE run (see bed_plane_calibration_summary_2026-08-22.json and
# bed_plane_calibration_raw_2026-08-22.csv in the repo). This assumes the bed surface
# itself is perfectly flat and applies ONLY the measured tilt-vs-horizontal - it is a
# synthesized linear plane sampled onto a 10x10 grid, NOT a physically re-probed
# topology mesh. PRINT_START already only does G28 + BED_MESH_PROFILE LOAD=default
# (no live BED_MESH_CALIBRATE/SCREWS_TILT_CALCULATE call), so no other bed-leveling
# routine runs automatically other than this static mesh plus the usual per-print
# Z-offset check.
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20, 20       # Account for probe offset
mesh_max: 250, 205     # Account for probe offset  
probe_count: 10, 10               # Was 7,7 (2026-08-13) - since a good mesh doesn't need to be redone often,
                                  # it's worth spending the extra ~20-25min for a much finer ~25x21mm grid to
                                  # properly resolve real bed topology vs probe noise/mounting-induced tilt.
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

# Quick 4-corner physical bed-screw leveling check (2026-08-13, coordinates
# corrected 2026-08-15). Run G28 then SCREWS_TILT_CALCULATE to probe the 4
# corners and get a clock-position turn amount per screw. screw_thread assumes
# CW lowers that corner (standard spring+bolt leveling knob) - if turning a
# screw the suggested amount makes that corner's reading WORSE instead of
# better, flip this to CCW-M4.
#
# IMPORTANT (2026-08-15): unlike [bed_mesh], Klipper does NOT auto-apply the
# probe x_offset/y_offset for screws_tilt_adjust - screw1..4 here must be the
# NOZZLE position, chosen so the PROBE (37mm -X, 7mm -Y from the nozzle) ends
# up over the actual screw/target point. Values below = desired probe target
# (30,30 / 250,30 / 250,205 / 30,205 - same corners already proven safe via
# bed_mesh mesh_min/mesh_max) + (37, 7) nozzle offset. A previous version of
# this section wrongly reused [bed_screws]'s nozzle-direct coordinates with no
# offset added, which sent the probe ~37mm/7mm past the intended corner (worst
# at the unchanged screw1: computed to probe position (-7,23), off the bed to
# the left) and crashed the nozzle into the bed 3 times. Confirmed NOT a
# BLTouch hardware fault - probe triggers correctly when pressed by hand.
[screws_tilt_adjust]
screw1: 67, 37
screw1_name: front left screw
screw2: 287, 37
screw2_name: front right screw
screw3: 287, 212
screw3_name: rear right screw
screw4: 67, 212
screw4_name: rear left screw
speed: 50
horizontal_move_z: 5
screw_thread: CW-M4

# Full bed mesh recalibration with bed preheat (2026-08-13). Preheating and holding
# the bed at temperature before/during probing avoids probing a cold, not-yet-expanded
# bed and then printing on a warm, slightly different one. Runs the full sequence
# (home, probe, save profile, SAVE_CONFIG) in one shot - SAVE_CONFIG restarts Klipper
# and clears homed state, so re-home afterward before printing.
[gcode_macro BED_MESH_CALIBRATE_FULL]
gcode:
    {% set BED = params.BED|default(60)|float %}
    M140 S{BED}
    M190 S{BED}
    G28
    BED_MESH_CALIBRATE PROFILE=default
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG

# 3-point bed orientation calibration (2026-08-17). Alternative to the 10x10
# BED_MESH_CALIBRATE_FULL above - only makes sense once the physical bed
# surface itself is confirmed flat (first fully-finished gridfinity print,
# 2026-08-16/17, done with BED_MESH_CLEAR active i.e. assuming a flat bed).
# If the surface really is flat, a full grid mesh isn't needed - we only need
# the bed's PLANE (a small X/Y tilt + a Z reference), which is fully
# determined by any 3 non-collinear points.
#
# Because probe repeatability on this printer swings a lot run-to-run (see
# test_probing.txt), each of the 3 points below is re-measured over many
# independent PASSES, with a full G28 re-home before EVERY single measurement
# (not just once per point), round-robining through all 3 points each pass so
# consecutive measurements of the same point are never back-to-back. Each
# measurement itself is a PROBE_ACCURACY SAMPLES=<n> call (Klipper's own
# built-in repeated-probe statistics), so every logged result is already a
# median/average of many raw probe strikes, not a single noisy reading.
#
# This macro deliberately does NOT try to compute the outlier-rejection
# statistics or plane fit itself in gcode/Jinja. Klipper macro templates
# render fully BEFORE any of their own gcode commands execute, so a macro
# can't reliably read the result of a command (like PROBE/PROBE_ACCURACY)
# that it just issued - only a later, separate macro call can see it. That
# makes anything beyond simple loops awkward to write correctly and, without
# a live interpreter to test against, risky to trust unattended for 30 min.
# Instead, this macro's only job is to safely and repeatedly drive the real
# hardware (home + move + probe) and log everything to klippy.log
# ("PROBE_ACCURACY at X:.. Y:.. ..." / "probe accuracy results: ..." lines);
# the statistics (median/MAD-based outlier rejection, trimmed mean per point,
# plane fit) are computed afterward from that log.
#
# Points reuse the same 3 (of 4) corner NOZZLE coordinates already verified
# safe via [screws_tilt_adjust] (front-left/front-right/rear-left), rather
# than introducing new, untested coordinates.
#
# Usage: BED_PLANE_CALIBRATE [BED=60] [PASSES=15] [SAMPLES=10]
# Defaults: 15 passes x 10 samples x 3 points = 450 raw probe strikes + 45
# full home cycles. Expect roughly 25-30 minutes. Does NOT touch [bed_mesh]
# or SAVE_CONFIG - probe-only, nothing is auto-applied.
#
# NOTE 1: macro deliberately avoids any digit-then-letters in its name (e.g.
# "3POINT") - per Klipper's own docs (Command_Templates.md - "G-Code Macro
# Naming"): "If any numbers are used in the macro name then they must all be
# at the end of the name (eg, TEST_MACRO25 is valid, but MACRO25_TEST3 is
# not)." A name like BED_LEVEL_3POINT_... gets truncated to BED_LEVEL_3 and
# reported as "Unknown command". Confirmed via live testing 2026-08-17.
#
# NOTE 2: the looping step below uses [delayed_gcode] + UPDATE_DELAYED_GCODE
# rather than a gcode_macro calling itself. Klipper's gcode_macro has a
# re-entrancy guard that raises "Macro X called recursively" if a macro tries
# to invoke itself directly (confirmed via live testing 2026-08-17). Using a
# delayed_gcode that re-arms itself via UPDATE_DELAYED_GCODE (a documented
# Klipper idiom - see Command_Templates.md "Delayed Gcodes") decouples each
# iteration through the reactor timer instead of the call stack, avoiding
# that guard.
[gcode_macro BED_PLANE_CALIBRATE]
variable_points: [[67, 37, 'front-left'], [287, 37, 'front-right'], [67, 212, 'rear-left']]
variable_passes: 15
variable_samples: 10
variable_pass_idx: 0
variable_point_idx: 0
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set PASSES = params.PASSES|default(15)|int %}
    {% set SAMPLES = params.SAMPLES|default(10)|int %}
    SET_GCODE_VARIABLE MACRO=BED_PLANE_CALIBRATE VARIABLE=passes VALUE={PASSES}
    SET_GCODE_VARIABLE MACRO=BED_PLANE_CALIBRATE VARIABLE=samples VALUE={SAMPLES}
    SET_GCODE_VARIABLE MACRO=BED_PLANE_CALIBRATE VARIABLE=pass_idx VALUE=0
    SET_GCODE_VARIABLE MACRO=BED_PLANE_CALIBRATE VARIABLE=point_idx VALUE=0
    {action_respond_info("BED_PLANE_CALIBRATE: preheating bed to %.0fC, then %d passes x %d samples/point over 3 points (%d probe units, %d raw strikes total). Expect ~25-30 minutes." % (BED, PASSES, SAMPLES, PASSES * 3, PASSES * 3 * SAMPLES))}
    M140 S{BED}
    M190 S{BED}
    UPDATE_DELAYED_GCODE ID=_bed_plane_calibrate_unit DURATION=0.01

[delayed_gcode _bed_plane_calibrate_unit]
gcode:
    {% set mac = printer["gcode_macro BED_PLANE_CALIBRATE"] %}
    {% set passes = mac.passes %}
    {% set samples = mac.samples %}
    {% set pass_idx = mac.pass_idx %}
    {% set point_idx = mac.point_idx %}
    {% set pt = mac.points[point_idx] %}
    {% if pass_idx >= passes %}
        _BED_PLANE_CALIBRATE_DONE
    {% else %}
        {action_respond_info("BED_PLANE_CALIBRATE: pass %d/%d, point '%s' (X%d Y%d) - homing then probing (%d samples)..." % (pass_idx + 1, passes, pt[2], pt[0], pt[1], samples))}
        G28
        G90
        G1 X{pt[0]} Y{pt[1]} Z10 F6000
        PROBE_ACCURACY SAMPLES={samples}
        SET_GCODE_VARIABLE MACRO=BED_PLANE_CALIBRATE VARIABLE=point_idx VALUE={(point_idx + 1) % 3}
        SET_GCODE_VARIABLE MACRO=BED_PLANE_CALIBRATE VARIABLE=pass_idx VALUE={pass_idx + 1 if (point_idx + 1) % 3 == 0 else pass_idx}
        UPDATE_DELAYED_GCODE ID=_bed_plane_calibrate_unit DURATION=0.01
    {% endif %}

[gcode_macro _BED_PLANE_CALIBRATE_DONE]
gcode:
    {action_respond_info("BED_PLANE_CALIBRATE: all passes complete. Raw data is in klippy.log ('PROBE_ACCURACY at ...' / 'probe accuracy results: ...' lines) - extract per-point results from there for the outlier-rejection/plane-fit analysis. [bed_mesh] and printer.cfg were NOT modified.")}

